  <h1 class="title">Sinagri: Satellite Intelligence for Agricultural Resilience &amp; Integrity</h1>

SLIDES.push({ title: '1. Introduction &amp; Problem Statement', html: `
  <p class="lead">Paddy rice cultivation is one of the largest sources of greenhouse gas (GHG) emissions in Southeast Asia. The anaerobic (oxygen-deprived) conditions in continuously flooded rice paddies create an ideal environment for methanogenic bacteria to produce <strong>Methane gas (CH4)</strong> in massive quantities through the decomposition of organic matter in waterlogged soil.</p>
  <p>Methane is estimated to have a Global Warming Potential (GWP) of approximately <strong>27 times that of CO2</strong> over a 100-year cycle (IPCC AR6, 2021).</p>
  <p>In Indonesia, the rice farming sector contributes approximately <strong>10–12% of total national GHG emissions</strong>. Traditional farmers in Bali — particularly members of the traditional <em>Subak</em> irrigation system — lack access to affordable, user-friendly MRV (<em>Measurement, Reporting, and Verification</em>) tools that meet international carbon verification standards.</p>
`});

SLIDES.push({ title: 'Solution: The Sinagri Platform (AgriMRV by Save Subak)', html: `
  <div class="callout callout-green">
    <strong>💡 Solution</strong>
    Sinagri is a dMRV (<em>digital Measurement, Reporting, and Verification</em>) platform built on publicly available satellite data from the European Space Agency (ESA). It is designed to monitor, report, and verify organic, environmentally-friendly rice farming practices automatically, transparently, and in a manner auditable by any third party — without relying on unilateral farmer claims.
  </div>
  <h2 class="sub">Purpose and Objectives</h2>
  <ul class="checklist">
    <li>Detect and verify the implementation of <strong>AWD (Alternate Wetting and Drying)</strong> — a water management technique proven to reduce methane emissions by 30–50%.</li>
    <li>Monitor compliance with <strong>Zero Burn</strong> protocols — prohibiting the burning of rice straw residue, which releases Black Carbon and massive CO2.</li>
    <li>Verify the success of <strong>Organic Farming</strong> — without synthetic chemical fertilizers — through satellite-based plant health indices.</li>
    <li>Establish a <strong>3-Year Historical Baseline</strong> as proof of <em>Additionality</em> required by Verra VM0051.</li>
    <li>Produce scientifically valid evidence for the issuance of <strong>honest, tamper-proof, and auditable carbon credits</strong>.</li>
  </ul>
`});

SLIDES.push({ title: '2.1 Sentinel-2 — Optical Multispectral Satellite', html: `
  <p><strong>Technical Specifications:</strong> 10–20m spatial resolution, 13 spectral bands (400–2400nm), 5-day revisit time per location, cloud cover automatically recorded via SCL (<em>Scene Classification Layer</em>).</p>
  <p><strong>Primary Function:</strong> A "giant camera" capturing reflected sunlight (visible and infrared) to compute the NDVI, NDWI, and NBR indices.</p>
  <div class="callout callout-amber">
    <strong>⚠️ Critical Limitation</strong>
    Optical sensors cannot penetrate clouds, fog, or smoke. In tropical Indonesia, cloud cover frequently reaches 70–100% during the wet season — which coincides with the rice growing season. Sentinel-2 data is automatically rejected by the system if cloud cover exceeds 15%.
  </div>
`});

SLIDES.push({ title: '2.2 Sentinel-1 — SAR Radar Satellite (System Backbone)', html: `
  <p><strong>Technical Specifications:</strong> C-band SAR (<em>Synthetic Aperture Radar</em>), 5.6 cm wavelength, VV and VH polarizations, ±6-day revisit time, day/night capable.</p>
  <p><strong>Absolute Advantage:</strong> The 5.6 cm microwave wavelength is thousands of times larger than cloud particles (2–200 μm), meaning it <strong>completely penetrates thick clouds, heavy rain, and fog</strong>. This makes Sentinel-1 the only sensor reliably usable for year-round paddy field monitoring in a tropical climate, and the <strong>primary sensor for AWD verification</strong>.</p>
  <div class="callout callout-blue">
    <strong>Analogy: The Tennis Ball Throw</strong>
    Radar behaves like a bat — throwing a "tennis ball" straight down at the earth. If the field is flooded (smooth like a mirror), the ball bounces away (echo lost). When the field is deliberately drained for AWD, the ball hits rough soil and bounces straight back up (loud echo). A graph that suddenly spikes upward tells the story of a farmer's AWD discipline without the satellite ever "seeing" it visually.
  </div>
`});

SLIDES.push({ title: '2.3 Automatic Fallback System (Sensor Selection Logic)', html: `
  <div class="flowchart">
<span class="step">EVERY SCAN CYCLE:</span>
<span class="branch">  → [Priority 1] Fetch SAR data from Sentinel-1 (VV &amp; VH)</span>
<span class="branch">      Available? → YES → Use as primary sensor ✓</span>
<span class="branch">      Available? → NO  → proceed to priority 2</span>

<span class="branch">  → [Priority 2] Fetch Sentinel-2 Optical data</span>
<span class="branch">      Cloud cover ≤ 15%? → YES → Use NDWI/NDVI ✓</span>
<span class="branch">      Cloud cover &gt; 15%?  → NOT VALID → scan discarded</span>

<span class="result">  OUTPUT: Field status (Wet/Dry) determined based on</span>
<span class="result">  the most reliable sensor available on that day.</span>
  </div>
  <p>Radar (Sentinel-1) is always prioritized since it can penetrate clouds — Optical (Sentinel-2) is used as backup/cross-check when skies are clear.</p>
`});

SLIDES.push({ title: '3.1 NDVI — Normalized Difference Vegetation Index', html: `
  <p><em>Scientific source: Rouse et al. (1974), Journal of Remote Sensing of Environment.</em></p>
  <div class="formula-box">
<span class="comment">// NDVI Formula (Sentinel-2)</span>
NDVI = (ρNIR − ρRed) / (ρNIR + ρRed)
     = (<span class="var">Band B08</span> − <span class="var">Band B04</span>) / (<span class="var">Band B08</span> + <span class="var">Band B04</span>)

<span class="comment">// Wavelengths: B08 (NIR) = 842 nm · B04 (Red) = 665 nm</span>
<span class="comment">// Value range: -1.0 to +1.0</span>
  </div>
  <p><strong>Why NIR and Red?</strong> Healthy rice leaves have <em>mesophyll</em> cells with a sponge-like structure that strongly reflects NIR while absorbing red light for photosynthesis. Result: NDVI = (High − Low)/(High + Low) = <strong>positive approaching +1</strong>. Bare soil or dead plants lack active cell structures → values approach 0 or go negative.</p>
`});

SLIDES.push({ title: 'NDVI — Thresholds &amp; Carbon Relevance', html: `
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>NDVI Value</th><th>Field Condition</th><th>Carbon Status</th></tr></thead>
    <tbody>
      <tr><td>&lt; 0.1</td><td>Bare soil / fallow / post-harvest</td><td>Neutral</td></tr>
      <tr><td>0.1 – 0.3</td><td>Seedling stage (young plants)</td><td>Early growth</td></tr>
      <tr><td class="highlight">0.3 – 0.5</td><td class="highlight">Active vegetative stage ← Field data: 0.315</td><td class="highlight">Active carbon sequestration</td></tr>
      <tr><td>0.5 – 0.7</td><td>Generative stage (peak greenness)</td><td>Peak carbon sequestration</td></tr>
      <tr><td>&gt; 0.7</td><td>Very dense canopy</td><td>Maximum carbon sequestration</td></tr>
    </tbody>
  </table></div>
  <div class="callout callout-green">
    <strong>Carbon Credit Relevance</strong>
    High NDVI = active photosynthesis = active CO2 absorption from the atmosphere (<em>Carbon Sequestration</em>). Each ton of paddy biomass that grows binds approximately ±0.44 tons of organic carbon from the air into plant tissue and soil.
  </div>
`});

SLIDES.push({ title: '3.2 NDWI — Normalized Difference Water Index', html: `
  <p><em>Scientific source: McFeeters, S.K. (1996), International Journal of Remote Sensing.</em></p>
  <div class="formula-box">
<span class="comment">// NDWI McFeeters Formula (Sentinel-2)</span>
NDWI = (ρGreen − ρNIR) / (ρGreen + ρNIR)
     = (<span class="var">Band B03</span> − <span class="var">Band B08</span>) / (<span class="var">Band B03</span> + <span class="var">Band B08</span>)

<span class="comment">// Wavelengths: B03 (Green) = 560 nm · B08 (NIR) = 842 nm</span>
<span class="comment">// System AWD threshold: DRY if NDWI &lt; -0.10</span>
  </div>
  <div class="callout callout-blue">
    <strong>Analogy: The Giant Sponge Swallowing a Rock</strong>
    Water has a unique property: it absorbs NIR wavelengths almost completely while still reflecting a small amount of green light. Result: <strong>positive</strong> value → water detected. When land is dry, leaves strongly reflect NIR → NDWI turns <strong>negative</strong>. This "bright-dark" blink on the satellite is the valid proof of AWD success.
  </div>
`});

SLIDES.push({ title: 'NDWI — Thresholds &amp; AWD Calculation', html: `
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>NDWI Value</th><th>Field Condition</th><th>AWD Calculation</th></tr></thead>
    <tbody>
      <tr><td>&gt; +0.3</td><td>Full flooding</td><td>No aeration days</td></tr>
      <tr><td>0.0 – 0.3</td><td>Shallow flooding / wet soil</td><td>No aeration days</td></tr>
      <tr><td>-0.1 – 0.0</td><td>Transition zone</td><td>Threshold boundary</td></tr>
      <tr><td class="danger">-0.1 to -0.4</td><td class="danger">DRY — AWD Aeration active ← Field data: -0.329</td><td class="danger">Aeration days counted ✓</td></tr>
      <tr><td>&lt; -0.4</td><td>Extreme dry / harvest phase</td><td>Aeration days counted ✓</td></tr>
    </tbody>
  </table></div>
  <p><strong>Important note:</strong> in Indonesia the growing season coincides with heavy monsoon cloud cover, so primary AWD verification duty falls to Radar VV (cloud-penetrating) — NDWI serves as a supporting cross-check when skies are clear.</p>
`});

SLIDES.push({ title: '3.3 NBR — Normalized Burn Ratio', html: `
  <p><em>Scientific source: Key, C.H. &amp; Benson, N.C. (2006), USDA Forest Service.</em></p>
  <div class="formula-box">
<span class="comment">// NBR Formula (Sentinel-2)</span>
NBR = (ρNIR − ρSWIR2) / (ρNIR + ρSWIR2)
    = (<span class="var">Band B08</span> − <span class="var">Band B12</span>) / (<span class="var">Band B08</span> + <span class="var">Band B12</span>)

<span class="comment">// Wavelengths: B08 (NIR) = 842 nm · B12 (SWIR2) = 2190 nm</span>
<span class="comment">// System threshold: NBR &gt; -0.25 → SAFE (Zero Burn) · NBR ≤ -0.25 → burning detected</span>
  </div>
  <p><strong>Why NIR and SWIR2?</strong> Healthy vegetation contains water that strongly absorbs SWIR while reflecting NIR strongly → positive NBR. Charcoal and ash from burning have 0% water content, causing SWIR to strongly reflect back → NBR drops deeply negative. The more negative the value, the more severe the burning event.</p>
  <p>The system guarantees a <strong>Zero Burn</strong> status as an absolute requirement for carbon credit issuance — a violation means credit cancellation.</p>
`});

SLIDES.push({ title: 'NBR — Thresholds &amp; Status', html: `
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>NBR Value</th><th>Field Condition</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td>&gt; 0.4</td><td>Very healthy vegetation</td><td class="highlight">✓ Very Safe</td></tr>
      <tr><td class="highlight">0.1 – 0.4</td><td class="highlight">Normal vegetation ← Field data: 0.148</td><td class="highlight">✓ Safe (Zero Burn)</td></tr>
      <tr><td>-0.1 – 0.1</td><td>Bare soil / post-harvest</td><td>Safe</td></tr>
      <tr><td class="warn">-0.25 – -0.1</td><td class="warn">⚠️ Light burn indication</td><td class="warn">Warning</td></tr>
      <tr><td class="danger">&lt; -0.25</td><td class="danger">🔴 Moderate to severe burn detected</td><td class="danger">Violation!</td></tr>
    </tbody>
  </table></div>
`});

SLIDES.push({ title: '3.4 Radar VV — Vertical-Vertical Backscatter (AWD Backbone)', html: `
  <p><em>Source: ESA Sentinel-1 SAR Technical Guide. Backscatter σ°VV (sigma-nought).</em></p>
  <div class="formula-box">
<span class="comment">// Sentinel-1 SAR — C-Band, 5.6 cm wavelength, Vertical Transmit → Vertical Receive</span>
σ°VV (linear) = Microwave backscatter coefficient

<span class="comment">// AgriMRV system thresholds:</span>
σ°VV ≥ <span class="val">0.28</span>  → Status: <span class="val">WET</span>  (field is flooded)
σ°VV ≤ <span class="val">0.22</span>  → Status: <span class="val">DRY</span>  (aeration in progress)
<span class="val">0.22</span> &lt; σ°VV &lt; <span class="val">0.28</span> → <span class="comment">Dead Zone (ambiguous — discarded)</span>
  </div>
  <div class="callout callout-blue">
    <strong>Why a Dead Zone (0.22–0.28)?</strong>
    Intentionally designed to prevent false positives. Morning dew, strong winds creating ripples on standing water, and satellite incidence angle variations can produce ambiguous VV values. The system conservatively does not count aeration days in this zone — a key principle for carbon reporting integrity.
  </div>
`});

SLIDES.push({ title: '3.5 Radar VH/VV — Composite Flood Index', html: `
  <div class="formula-box">
<span class="comment">// Sentinel-1 — Cross-polarization: Vertical Transmit → Horizontal Receive</span>
Flood Index = σ°VH / σ°VV  <span class="comment">(Cross-Polarization Ratio)</span>

<span class="comment">// VH: sensitive to 3D volume &amp; structure of rice canopy</span>
<span class="comment">// VV: sensitive to ground surface (dry vs wet)</span>
<span class="comment">// Ratio VH/VV eliminates incidence angle effects,</span>
<span class="comment">// producing a more stable flood signal throughout the year</span>

<span class="comment">// Actual field data (Made Sengger, 12 Jul 2026): VH/VV = 0.271 → transition zone (semi-dry)</span>
  </div>
  <p><strong>3.5b — Radar VH (Canopy Density):</strong> scans the 3D physical structure of the plant canopy, regardless of dark or cloudy weather. During high rainfall when optical NDVI goes "blind" from clouds, VH takes over proving biomass — validating that CO2 absorption by plants never stops.</p>
`});

SLIDES.push({ title: 'System Accuracy Evidence: The Mirror Pattern', html: `
  <p class="lead">NDVI and NDWI graphs that move in precise opposite symmetry ("mirror-image") are <strong>proof of system accuracy</strong> for paddy fields.</p>
  <h2 class="sub">Why Do the Lines Move Like a Mirror?</h2>
  <ol style="padding-left:20px; font-size:14.5px; line-height:1.8;">
    <li><strong>Flooding Phase (start of graph):</strong> The field is plowed and flooded. Water absorbs NIR → <strong>NDWI spikes high</strong>. No leaves yet → <strong>NDVI drops</strong>.</li>
    <li><strong>Dense Vegetative Phase (mid-graph):</strong> Rice grows thick, covering the water. Leaves reflect NIR massively → <strong>NDVI spikes sharply</strong>. Water hidden under canopy → <strong>NDWI drops negative</strong>.</li>
  </ol>
  <p>This "crossing mirror" pattern is a unique fingerprint of a healthy rice cultivation cycle — repeating consistently every growing season across 3 years of historical data (237 data points, Jul 2023–Jul 2026), fulfilling the Verra VM0051 historical baseline requirement.</p>
`});

SLIDES.push({ title: 'Core Algorithm: Hysteresis (Anti False-Positive)', html: `
  <p>The system does not merely record satellite index values — it applies a <strong>Hysteresis</strong> algorithm to ensure every Aeration Day genuinely reflects sustained real-world field conditions, not a momentary anomaly.</p>
  <div class="flowchart">
<span class="step">STEP 1 — Sensor Selection:</span>
<span class="branch">  SAR available? → Primary priority · Not available? → NDWI (optical fallback, cloud ≤15%)</span>

<span class="step">STEP 2 — Raw Status Determination:</span>
<span class="branch">  SAR: VV≥0.28→wet · VV≤0.22→dry · dead zone→skip</span>
<span class="branch">  NDWI: score&lt;-0.10→dry · score≥-0.10→wet</span>

<span class="step">STEP 3 — Hysteresis Check:</span>
<span class="branch">  Same as confirmed status? → reset candidate, unchanged</span>
<span class="branch">  Different? → increment candidate_run. If ≥2 consecutive →</span>
<span class="result">      TRANSITION CONFIRMED, official status changes</span>

<span class="step">STEP 4 — Aeration Day Accumulation:</span>
<span class="result">  While status='dry', add the day difference between scans</span>
  </div>
`});

SLIDES.push({ title: 'Why Require a Minimum of 2 Consecutive Scans?', html: `
  <div class="callout callout-blue">
    <strong>Standard Signal Processing Technique (Anti False-Positive)</strong>
    A single anomaly (e.g. one day of heavy rain suddenly raising VV mid-dry season) will not change the official status. Status only changes if <strong>two independent scans</strong> (separated by ±5–6 days) consistently show the same condition — a critical safeguard for carbon data integrity.
  </div>

  <p>The weakness of radar sensors (susceptible to dew/wind noise) is addressed via 2 layers of filtration: (1) the hysteresis logic above, and (2) a <strong>Piezometer</strong> — farmers install a perforated PVC pipe in their field and enter the actual groundwater level into the app as a manual calibrator against the satellite's estimate.</p>

SLIDES.push({ title: 'Technical Appendix: Verification Code (Whitebox)', html: `
  <p>This section is provided specifically for technical auditors (a <em>Whitebox</em> approach) to verify that index calculations use pure, standard international formulas — not a hidden black box.</p>
  <div class="formula-box" style="color:#e2e8f0;">
<span class="comment">/**
 * SATELLITE INDEX CALCULATION FUNCTIONS (SENTINEL-2)
 * Platform: Sinagri (AgriMRV by Save Subak)
 */</span>

<span class="comment">// 1. NDVI (Normalized Difference Vegetation Index)</span>
export function calculateNDVI(nir, red) {
    if (nir + red === 0) return 0; <span class="comment">// Prevents division-by-zero error</span>
    return (nir - red) / (nir + red);
}

<span class="comment">// 2. NDWI (Normalized Difference Water Index) - McFeeters method</span>
export function calculateNDWI(green, nir) {
    if (green + nir === 0) return 0;
    return (green - nir) / (green + nir);
}

<span class="comment">// 3. NBR (Normalized Burn Ratio)</span>
export function calculateNBR(nir, swir) {
    if (nir + swir === 0) return 0;
    return (nir - swir) / (nir + swir);
}
  </div>
`});

// ---------- Deck engine ----------
let current = 0;
const deck = document.getElementById('deck');
const counter = document.getElementById('counter');
const progressFill = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function render() {
  deck.innerHTML = '';
  SLIDES.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === current ? ' active' : '') + (s.cover ? ' cover' : '');
    if (s.cover) {
      el.innerHTML = s.html;
    } else {
      el.innerHTML = `<div class="slide-kicker">Sinagri — Technical Methodology</div><h1>${s.title}</h1><div class="body-scroll">${s.html}</div>`;
    }
    deck.appendChild(el);
  });
  counter.textContent = `Slide ${current + 1}/${SLIDES.length}`;
  progressFill.style.width = ((current + 1) / SLIDES.length * 100) + '%';
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === SLIDES.length - 1;
}

function go(delta) {
  const next = current + delta;
  if (next < 0 || next >= SLIDES.length) return;
  current = next;
  render();
}

prevBtn.addEventListener('click', () => go(-1));
nextBtn.addEventListener('click', () => go(1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

render();
</script>
