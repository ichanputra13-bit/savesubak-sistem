// ---------- Deck engine ----------
let current = 0;
const deck = document.getElementById('deck');
const counter = document.getElementById('counter');
const progressFill = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function render() {
  deck.innerHTML = '';
  SLIDES.forEach((s, i) => {
    const el = document.createElement('div');
    let cls = 'slide' + (i === current ? ' active' : '');
    if (s.variant === 'cover') cls += ' cover';
    if (s.variant === 'closing') cls += ' cover closing';
    if (s.variant === 'video') cls += ' video-slide';
    el.className = cls;
    if (s.variant === 'cover' || s.variant === 'closing') {
      el.innerHTML = s.html;
    } else {
      el.innerHTML = `<div class="slide-inner">${s.html}</div>`;
    }
    deck.appendChild(el);
  });
  counter.textContent = `Slide ${current + 1}/${SLIDES.length}`;
  progressFill.style.width = ((current + 1) / SLIDES.length * 100) + '%';
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === SLIDES.length - 1;
}

function go(delta) {
  const next = current + delta;
  if (next < 0 || next >= SLIDES.length) return;
  current = next;
  render();
}

prevBtn.addEventListener('click', () => go(-1));
nextBtn.addEventListener('click', () => go(1));
document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'VIDEO') return;
  if (e.key === 'ArrowRight' || e.key === ' ') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

render();
</script>
