<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinagri — Presentasi Metodologi Teknis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #16a34a; --green-dark: #14532d; --green-light: #dcfce7;
    --blue: #1d4ed8; --blue-light: #dbeafe;
    --amber: #d97706; --amber-light: #fef3c7;
    --red: #dc2626; --red-light: #fee2e2;
    --gray: #6b7280; --gray-light: #f9fafb; --border: #e5e7eb; --text: #111827;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', sans-serif; color: var(--text);
    background: #0b1220;
  }
  .deck { position: relative; width: 100vw; height: 100vh; }
  .slide {
    position: absolute; inset: 0; display: none;
    flex-direction: column; padding: 56px 80px 90px;
    background: white; overflow-y: auto;
  }
  .slide.active { display: flex; }
  .slide-kicker {
    font-size: 12px; font-weight: 700; color: var(--green);
    text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
  }
  .slide h1 {
    font-size: 30px; font-weight: 800; color: var(--green-dark);
    border-left: 6px solid var(--green); padding-left: 16px; margin-bottom: 20px;
    line-height: 1.25;
  }
  .slide h2.sub { font-size: 16px; font-weight: 700; color: var(--blue); margin: 18px 0 8px; }
  .slide p { font-size: 15px; line-height: 1.65; color: #374151; margin-bottom: 10px; }
  .slide .lead { font-size: 17px; color: #1f2937; }
  .slide ul.checklist { list-style: none; margin: 8px 0; }
  .slide ul.checklist li { font-size: 14.5px; padding: 5px 0; }
  .slide ul.checklist li::before { content: '✓ '; color: var(--green); font-weight: 700; }
  .body-scroll { flex: 1; overflow-y: auto; padding-right: 6px; }

  .formula-box {
    background: #0f172a; color: #86efac; font-family: 'JetBrains Mono', monospace;
    font-size: 13px; line-height: 1.85; padding: 16px 22px; border-radius: 10px;
    margin: 12px 0; overflow-x: auto; border-left: 4px solid var(--green);
  }
  .formula-box .comment { color: #64748b; }
  .formula-box .var { color: #93c5fd; }
  .formula-box .val { color: #fbbf24; }

  .callout { border-radius: 10px; padding: 14px 18px; margin: 12px 0; border-left: 4px solid; font-size: 14px; }
  .callout-green { background: var(--green-light); border-color: var(--green); }
  .callout-blue { background: var(--blue-light); border-color: var(--blue); }
  .callout-amber { background: var(--amber-light); border-color: var(--amber); }
  .callout strong { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .callout-green strong { color: var(--green-dark); }
  .callout-blue strong { color: var(--blue); }
  .callout-amber strong { color: var(--amber); }

  table.data-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
  table.data-table th { background: var(--green-dark); color: white; padding: 8px 12px; text-align: left; }
  table.data-table td { padding: 7px 12px; border-bottom: 1px solid var(--border); }
  table.data-table tr:nth-child(even) td { background: var(--gray-light); }
  table.data-table td.highlight { color: var(--green); font-weight: 700; }
  table.data-table td.warn { color: var(--amber); font-weight: 600; }
  table.data-table td.danger { color: var(--red); font-weight: 700; }
  .table-wrap { overflow-x: auto; }

  .flowchart {
    background: #0f172a; color: #e2e8f0; font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px; line-height: 1.95; padding: 16px 20px; border-radius: 10px;
    margin: 10px 0; border-left: 4px solid var(--blue);
  }
  .flowchart .step { color: #93c5fd; } .flowchart .branch { color: #86efac; } .flowchart .result { color: #fbbf24; }

  .figure-img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 10px; border: 1px solid var(--border); background: var(--gray-light); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0; }
  .stat-card { background: var(--gray-light); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
  .stat-card .val { font-size: 24px; font-weight: 800; color: var(--green); }
  .stat-card .label { font-size: 10.5px; color: var(--gray); margin-top: 2px; }
  .stat-card .unit { font-size: 10.5px; font-weight: 600; color: var(--green-dark); }
  .cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  /* Cover slide */
  .slide.cover { align-items: center; justify-content: center; text-align: center; background: linear-gradient(160deg,#f0fdf4 0%,#ffffff 50%,#eff6ff 100%); }
  .cover .org-name { font-size: 13px; color: var(--green); font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
  .cover h1.title { font-size: 40px; font-weight: 800; color: var(--green-dark); border: none; padding: 0; max-width: 780px; margin-bottom: 14px; }
  .cover .subtitle { font-size: 16px; color: var(--gray); max-width: 640px; margin-bottom: 30px; }
  .cover .meta-pills { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  .cover .pill { font-size: 12px; background: var(--green-light); color: var(--green-dark); padding: 6px 14px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; }

  /* Nav chrome */
  .chrome {
    position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
    background: rgba(15,23,42,0.94); display: flex; align-items: center;
    justify-content: space-between; padding: 0 28px; z-index: 50; color: white;
  }
  .chrome .progress-wrap { flex: 1; margin: 0 24px; }
  .chrome .progress-track { height: 4px; background: #334155; border-radius: 4px; overflow: hidden; }
  .chrome .progress-fill { height: 100%; background: var(--green); transition: width .25s ease; }
  .chrome .counter { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #94a3b8; margin-top: 6px; text-align: center; }
  .chrome button {
    background: var(--green); color: white; border: none; padding: 10px 20px;
    border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .chrome button:disabled { background: #334155; cursor: not-allowed; }
  .chrome .doc-tag { font-size: 11px; color: #94a3b8; font-family: 'JetBrains Mono', monospace; }

  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
</style>
</head>
<body>

<div class="deck" id="deck"></div>

<div class="chrome">
  <div class="doc-tag">SINAGRI-PRES-ID</div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

</div>

<script>
const SLIDES = [];

SLIDES.push({ cover: true, html: `
  <div class="org-name">Save Subak</div>
  <h1 class="title">Sinagri: Satellite Intelligence for Agricultural Resilience &amp; Integrity</h1>
  <p class="subtitle">Metodologi teknis sistem pemantauan pengurangan emisi metana berbasis satelit untuk budidaya padi sawah organik — Standar Verra VM0051 &amp; IPCC Tier 2</p>
  <div class="meta-pills">
    <span class="pill">Verra VM0051 / IPCC AR6 Tier 2</span>
    <span class="pill">ESA Copernicus (Sentinel-1 &amp; 2)</span>

`});

SLIDES.push({ title: '1. Pendahuluan &amp; Latar Belakang Masalah', html: `
  <p class="lead">Sawah padi merupakan salah satu sumber emisi gas rumah kaca (GRK) terbesar di Asia Tenggara. Kondisi anaerob (tanpa oksigen) pada sawah yang selalu tergenang menciptakan lingkungan ideal bagi bakteri metanogen untuk memproduksi <strong>Gas Metana (CH4)</strong> dalam jumlah masif dari dekomposisi bahan organik di dalam lumpur.</p>
  <p>Gas metana diperkirakan memiliki potensi pemanasan global (<em>Global Warming Potential</em>, GWP) sekitar <strong>27 kali lipat CO2</strong> dalam siklus 100 tahun (IPCC AR6, 2021).</p>
  <p>Di Indonesia, sektor pertanian padi berkontribusi sekitar <strong>10–12% dari total emisi GRK nasional</strong>. Petani tradisional di Bali — khususnya anggota sistem irigasi adat <em>Subak</em> — tidak memiliki akses ke alat MRV (<em>Measurement, Reporting, and Verification</em>) yang terjangkau, mudah digunakan, dan memenuhi standar verifikasi internasional untuk kredit karbon.</p>
`});

SLIDES.push({ title: 'Solusi: Platform Sinagri (AgriMRV by Save Subak)', html: `
  <div class="callout callout-green">
    <strong>💡 Solusi</strong>
    Sinagri adalah platform dMRV (<em>digital Measurement, Reporting, and Verification</em>) berbasis satelit publik dari European Space Agency (ESA) yang dirancang untuk memantau, melaporkan, dan memverifikasi praktik pertanian padi organik ramah lingkungan secara otomatis, transparan, dan dapat diaudit oleh pihak mana pun tanpa bergantung pada klaim sepihak petani.
  </div>
  <h2 class="sub">Maksud &amp; Tujuan Sistem</h2>
  <ul class="checklist">
    <li>Mendeteksi dan memverifikasi penerapan <strong>AWD (Alternate Wetting and Drying)</strong> — teknik pengeringan berkala yang terbukti memotong emisi metana 30–50%.</li>
    <li>Memantau kepatuhan <strong>Zero Burn</strong> — tidak membakar jerami sisa panen yang akan melepaskan <em>Black Carbon</em> dan CO2 masif.</li>
    <li>Memverifikasi keberhasilan <strong>Pertanian Organik</strong> — tanpa pupuk kimia sintetis — melalui indeks kesehatan tanaman berbasis satelit.</li>
    <li>Membangun <strong>Baseline Historis 3 Tahun</strong> sebagai bukti <em>Additionality</em> yang disyaratkan Verra VM0051.</li>
    <li>Menghasilkan bukti ilmiah terstandar untuk penerbitan <strong>kredit karbon yang jujur, tidak dapat dipalsukan, dan dapat diaudit</strong>.</li>
  </ul>
`});

SLIDES.push({ title: '2.1 Sentinel-2 — Satelit Optik Multispektral', html: `
  <p><strong>Spesifikasi Teknis:</strong> Resolusi spasial 10–20m, 13 band spektral (400–2400nm), <em>revisit time</em> 5 hari per titik, tutupan awan dicatat otomatis oleh pemroses SCL (<em>Scene Classification Layer</em>).</p>
  <p><strong>Fungsi Utama:</strong> "Kamera raksasa" yang menangkap pantulan cahaya matahari (kasat mata maupun inframerah) untuk menghitung indeks NDVI, NDWI, dan NBR.</p>
  <div class="callout callout-amber">
    <strong>⚠️ Keterbatasan Kritis</strong>
    Sensor optik tidak dapat menembus awan, kabut, atau asap. Di wilayah tropis Indonesia, tutupan awan sering mencapai 70–100% selama musim hujan — bertepatan dengan masa tanam padi. Data Sentinel-2 otomatis ditolak sistem jika tutupan awan melebihi 15%.
  </div>
`});

SLIDES.push({ title: '2.2 Sentinel-1 — Satelit Radar SAR (Backbone Sistem)', html: `
  <p><strong>Spesifikasi Teknis:</strong> Teknologi <em>Synthetic Aperture Radar</em> (SAR) band-C, panjang gelombang 5.6 cm, polarisasi VV dan VH, <em>revisit time</em> ±6 hari, beroperasi siang dan malam.</p>
  <p><strong>Keunggulan Mutlak:</strong> Gelombang mikro 5.6 cm memiliki panjang ribuan kali lebih besar dari partikel awan (2–200 μm) sehingga <strong>menembus awan tebal, hujan lebat, dan kabut secara sempurna</strong>. Ini menjadikan Sentinel-1 sebagai satu-satunya sensor yang dapat diandalkan untuk pemantauan sawah sepanjang tahun di iklim tropis, dan <strong>sensor utama verifikasi praktik AWD</strong>.</p>
  <div class="callout callout-blue">
    <strong>Analogi: Lemparan Bola Tenis</strong>
    Radar bertindak seperti kelelawar — melempar "bola tenis" lurus ke bumi. Jika lahan digenangi air (licin seperti cermin), bola terpantul menjauh (gema hilang). Saat lahan sengaja dikeringkan untuk AWD, bola menabrak tanah kasar dan memantul lurus kembali ke atas (gema keras). Grafik yang tiba-tiba meroket naik menceritakan kedisiplinan AWD petani tanpa satelit harus "melihatnya" secara visual.
  </div>
`});

SLIDES.push({ title: '2.3 Sistem Fallback Otomatis (Logika Pemilihan Sensor)', html: `
  <div class="flowchart">
<span class="step">SETIAP SIKLUS SCAN:</span>
<span class="branch">  → [Prioritas 1] Ambil data SAR Sentinel-1 (VV &amp; VH)</span>
<span class="branch">      Tersedia? → YA → Gunakan sebagai sensor utama ✓</span>
<span class="branch">      Tersedia? → TIDAK → lanjut ke prioritas 2</span>

<span class="branch">  → [Prioritas 2] Ambil data Sentinel-2 Optik</span>
<span class="branch">      Tutupan awan ≤ 15%? → YA → Gunakan NDWI/NDVI ✓</span>
<span class="branch">      Tutupan awan &gt; 15%?  → TIDAK VALID → Scan diabaikan</span>

<span class="result">  HASIL: Status lahan (Basah/Kering) ditentukan berdasarkan</span>
<span class="result">  sensor terpercaya yang tersedia pada hari tersebut.</span>
  </div>
  <p>Radar (Sentinel-1) selalu diprioritaskan karena bisa menembus awan — Optik (Sentinel-2) dipakai sebagai cadangan/cross-check saat langit cerah.</p>
`});

SLIDES.push({ title: '3.1 NDVI — Normalized Difference Vegetation Index', html: `
  <p><em>Sumber ilmiah: Rouse et al. (1974), Journal of Remote Sensing of Environment.</em></p>
  <div class="formula-box">
<span class="comment">// Rumus NDVI (Sentinel-2)</span>
NDVI = (ρNIR − ρRed) / (ρNIR + ρRed)
     = (<span class="var">Band B08</span> − <span class="var">Band B04</span>) / (<span class="var">Band B08</span> + <span class="var">Band B04</span>)

<span class="comment">// Panjang gelombang: B08 (NIR) = 842 nm · B04 (Red) = 665 nm</span>
<span class="comment">// Range nilai: -1.0 hingga +1.0</span>
  </div>
  <div class="callout callout-blue">
    <strong>Analogi: "Burger Merah dan Batu Panas"</strong>
    Matahari melempar cahaya Merah dan Inframerah (Batu Panas). Daun padi sehat melahap habis si Merah, dan menendang jauh-jauh Batu Panas. Satelit menghitung (Tinggi − Nol)/(Tinggi + Nol) = <strong>Positif Tinggi</strong>. Tanah kosong tidak bisa "makan" cahaya merah, sehingga nilainya negatif.
  </div>
`});

SLIDES.push({ title: 'NDVI — Ambang Batas &amp; Relevansi Karbon', html: `
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>Nilai NDVI</th><th>Kondisi Lapangan</th><th>Status Karbon</th></tr></thead>
    <tbody>
      <tr><td>&lt; 0.1</td><td>Tanah kosong / bera / pasca panen</td><td>Netral</td></tr>
      <tr><td>0.1 – 0.3</td><td>Fase semai (bibit muda)</td><td>Pertumbuhan awal</td></tr>
      <tr><td class="highlight">0.3 – 0.5</td><td class="highlight">Fase vegetatif aktif ← Data lahan: 0.315</td><td class="highlight">Serapan karbon aktif</td></tr>
      <tr><td>0.5 – 0.7</td><td>Fase generatif (puncak hijau)</td><td>Serapan karbon puncak</td></tr>
      <tr><td>&gt; 0.7</td><td>Kanopi sangat lebat</td><td>Serapan karbon maksimum</td></tr>
    </tbody>
  </table></div>
  <div class="callout callout-green">
    <strong>Relevansi Kredit Karbon</strong>
    NDVI tinggi = fotosintesis aktif = penyerapan CO2 dari atmosfer (<em>Carbon Sequestration</em>). Setiap ton biomassa padi yang tumbuh mengikat ±0.44 ton karbon organik dari udara ke jaringan tanaman dan tanah. Kurva NDVI yang terus menanjak membuktikan tanah organik mampu menopang pertumbuhan tanaman dengan sempurna, tanpa pupuk kimia sintesis.
  </div>
`});

SLIDES.push({ title: '3.2 NDWI — Normalized Difference Water Index', html: `
  <p><em>Sumber ilmiah: McFeeters, S.K. (1996), International Journal of Remote Sensing.</em></p>
  <div class="formula-box">
<span class="comment">// Rumus NDWI McFeeters (Sentinel-2)</span>
NDWI = (ρGreen − ρNIR) / (ρGreen + ρNIR)
     = (<span class="var">Band B03</span> − <span class="var">Band B08</span>) / (<span class="var">Band B03</span> + <span class="var">Band B08</span>)

<span class="comment">// Panjang gelombang: B03 (Green) = 560 nm · B08 (NIR) = 842 nm</span>
<span class="comment">// Threshold sistem: KERING jika NDWI &lt; -0.10</span>
  </div>
  <div class="callout callout-blue">
    <strong>Analogi: "Spons Raksasa Penelan Batu"</strong>
    Air adalah musuh inframerah — saat NIR jatuh ke air, air menelannya tanpa sisa. Cahaya Hijau tetap memantul sedikit → nilai <strong>Positif Terang</strong>. Saat lahan dikeringkan untuk AWD, tanah menendang inframerah kembali ke angkasa → nilai berubah <strong>Negatif Gelap</strong>. Kedipan "Terang-Gelap" inilah bukti valid keberhasilan AWD.
  </div>
`});

SLIDES.push({ title: 'NDWI — Ambang Batas &amp; Kalkulasi AWD', html: `
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>Nilai NDWI</th><th>Kondisi Lapangan</th><th>Kalkulasi AWD</th></tr></thead>
    <tbody>
      <tr><td>&gt; +0.3</td><td>Genangan penuh</td><td>Tidak ada hari aerasi</td></tr>
      <tr><td>0.0 – 0.3</td><td>Genangan dangkal / tanah lembab</td><td>Tidak ada hari aerasi</td></tr>
      <tr><td>-0.1 – 0.0</td><td>Zona transisi</td><td>Ambang batas</td></tr>
      <tr><td class="danger">-0.1 hingga -0.4</td><td class="danger">KERING — Aerasi AWD berjalan ← Data lahan: -0.329</td><td class="danger">Hari aerasi dihitung ✓</td></tr>
      <tr><td>&lt; -0.4</td><td>Kering ekstrem / fase panen</td><td>Hari aerasi dihitung ✓</td></tr>
    </tbody>
  </table></div>
  <p><strong>Catatan penting:</strong> di Indonesia musim tanam berbarengan dengan awan hujan pekat, sehingga tugas utama verifikasi AWD diserahkan pada Radar VV (menembus awan) — NDWI berperan sebagai pendukung/cross-check saat cuaca cerah.</p>
`});

SLIDES.push({ title: '3.3 NBR — Normalized Burn Ratio', html: `
  <p><em>Sumber ilmiah: Key, C.H. &amp; Benson, N.C. (2006), USDA Forest Service.</em></p>
  <div class="formula-box">
<span class="comment">// Rumus NBR (Sentinel-2)</span>
NBR = (ρNIR − ρSWIR2) / (ρNIR + ρSWIR2)
    = (<span class="var">Band B08</span> − <span class="var">Band B12</span>) / (<span class="var">Band B08</span> + <span class="var">Band B12</span>)

<span class="comment">// Panjang gelombang: B08 (NIR) = 842 nm · B12 (SWIR2) = 2190 nm</span>
<span class="comment">// Ambang: NBR &gt; -0.25 → AMAN (Zero Burn) · NBR ≤ -0.25 → indikasi pembakaran</span>
  </div>
  <div class="callout callout-blue">
    <strong>Analogi: "Sinar Oven Pencari Abu"</strong>
    Sinar Oven (SWIR) terserap oleh benda basah. Lahan panen normal masih lembap → menyerap habis Sinar Oven (nilai <strong>Positif</strong>). Jika lahan dibakar, arang dan abu yang kerontang (0% air) memantulkan Sinar Oven hingga menyilaukan satelit → nilai anjlok ke <strong>Negatif Tajam</strong>.
  </div>
  <p>Sistem menggaransi status <strong>Zero Burn</strong> (Nol Pembakaran) sebagai syarat mutlak penerbitan kredit karbon — pelanggaran berarti pembatalan kredit.</p>
`});

SLIDES.push({ title: 'NBR — Ambang Batas &amp; Status', html: `
  <div class="table-wrap"><table class="data-table">
    <thead><tr><th>Nilai NBR</th><th>Kondisi Lapangan</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td>&gt; 0.4</td><td>Vegetasi sangat sehat</td><td class="highlight">✓ Sangat Aman</td></tr>
      <tr><td class="highlight">0.1 – 0.4</td><td class="highlight">Vegetasi normal ← Data lahan: 0.148</td><td class="highlight">✓ Aman (Zero Burn)</td></tr>
      <tr><td>-0.1 – 0.1</td><td>Tanah terbuka / pasca panen</td><td>Aman</td></tr>
      <tr><td class="warn">-0.25 – -0.1</td><td class="warn">⚠️ Indikasi pembakaran ringan</td><td class="warn">Peringatan</td></tr>
      <tr><td class="danger">&lt; -0.25</td><td class="danger">🔴 Pembakaran sedang-berat</td><td class="danger">Pelanggaran!</td></tr>
    </tbody>
  </table></div>
`});

SLIDES.push({ title: '3.4 Radar VV — Backscatter Vertikal (Backbone AWD)', html: `
  <p><em>Sumber: ESA Sentinel-1 SAR Technical Guide. Backscatter σ°VV (sigma-nought).</em></p>
  <div class="formula-box">
<span class="comment">// Sentinel-1 SAR — Band C, panjang gelombang 5.6 cm, Transmisi Vertikal → Penerimaan Vertikal</span>
σ°VV (linear) = Koefisien pantulan balik gelombang mikro

<span class="comment">// Ambang batas sistem:</span>
σ°VV ≥ <span class="val">0.28</span>  → Status: <span class="val">BASAH</span> (sawah tergenang)
σ°VV ≤ <span class="val">0.22</span>  → Status: <span class="val">KERING</span> (aerasi berjalan)
<span class="val">0.22</span> &lt; σ°VV &lt; <span class="val">0.28</span> → <span class="comment">Zona Mati (ambigu — diabaikan)</span>
  </div>
  <div class="callout callout-blue">
    <strong>Mengapa Ada Zona Mati (0.22–0.28)?</strong>

export function calculateNDVI(nir, red) {
    if (nir + red === 0) return 0; <span class="comment">// Mencegah error pembagian 0</span>

    if (green + nir === 0) return 0;
    return (green - nir) / (green + nir);

export function calculateNBR(nir, swir) {
    if (nir + swir === 0) return 0;
    return (nir - swir) / (nir + swir);

// ---------- Deck engine ----------
let current = 0;
const deck = document.getElementById('deck');
const counter = document.getElementById('counter');
const progressFill = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function render() {
  deck.innerHTML = '';
  SLIDES.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === current ? ' active' : '') + (s.cover ? ' cover' : '');
    if (s.cover) {
      el.innerHTML = s.html;
    } else {
      el.innerHTML = `<div class="slide-kicker">Sinagri — Metodologi Teknis</div><h1>${s.title}</h1><div class="body-scroll">${s.html}</div>`;
    }
    deck.appendChild(el);
  });
  counter.textContent = `Slide ${current + 1}/${SLIDES.length}`;
  progressFill.style.width = ((current + 1) / SLIDES.length * 100) + '%';
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === SLIDES.length - 1;
}

function go(delta) {
  const next = current + delta;
  if (next < 0 || next >= SLIDES.length) return;
  current = next;
  render();
}

prevBtn.addEventListener('click', () => go(-1));
nextBtn.addEventListener('click', () => go(1));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

render();
</script>
</body>
</html>
